<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #e9f7ef;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: "Times New Roman", Times, serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
    }
    h2 {
      text-align: center;
      color: #1e8449;
      margin-bottom: 18px;
    }
    /* ---------- FORM ---------- */
    .form-group { margin-bottom: 12px; }
    label {
      font-size: 14px;
      display: block;
      margin-bottom: 4px;
    }
    .name-row {
      display: flex;
      gap: 12px;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1.6px solid #27ae60;
      font-family: "Times New Roman", Times, serif;
    }
    textarea { resize: none; min-height: 90px; }
    input:focus, textarea:focus {
      outline: none;
      border-color: #1e8449;
      box-shadow: 0 0 0 2px rgba(30,132,73,0.15);
    }
    button.submit-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      background: #27ae60;
      color: white;
      cursor: pointer;
    }
    /* ---------- TABLE ---------- */
    .table-wrapper {
      margin-top: 22px;
      border-top: 1px solid #ddd;
      padding-top: 14px;
    }
    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    th {
      background: #eafaf1;
      color: #1e8449;
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
    }
    td {
      padding: 12px 10px;
      border: 1px solid #ddd;
      vertical-align: top;
      line-height: 1.5;
      word-wrap: break-word;
    }
    th:nth-child(1), td:nth-child(1) { width: 25%; }
    th:nth-child(2), td:nth-child(2) { width: 25%; }
    th:nth-child(3), td:nth-child(3) { width: 25%; }
    th:nth-child(4), td:nth-child(4) { width: 25%; }
  action-btn {
    width: 80px;           
    padding: 8px 0;
    font-size: 14px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: white;
  }
.action-btn.edit {
  background-color: #1e88e5;
}
.action-btn.delete {
  background-color: #e53935;
}
    .action-btn:hover {
      opacity: 0.9;
    }
    /* ---------- MOBILE ---------- */
    @media (max-width: 480px) {
      .name-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>📩 Contact Us</h2>
    <form id="contactForm">
      <div class="name-row">
        <div class="form-group">
          <label>First Name</label>
          <input id="firstName" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input id="lastName" required>
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input id="email" type="email" required>
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea id="message" required></textarea>
      </div>
      <button class="submit-btn" type="submit">Submit</button>
    </form>
    <div id="status"></div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Message</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="contactTable">
                 </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="./w6.js"></script>
</body>
</html>
